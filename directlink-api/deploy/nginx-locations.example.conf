# Add inside BOTH existing HTTP/HTTPS authenticated server blocks.
# Keep server auth_basic and auth_basic_user_file. Do not expose raw backend.
# The secret must be generated and stored in a root-only real nginx config.
location ^~ /direct-admin/ {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:18889;
    proxy_set_header X-Directlink-Admin-Key "REPLACE_WITH_SAME_PRIVATE_ADMIN_KEY";
    proxy_set_header Authorization "";
    proxy_read_timeout 195s;
    proxy_send_timeout 195s;
    proxy_buffering off;
    access_log off;
}
location ^~ /direct-api/ {
    auth_basic off;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:18889;
    proxy_set_header X-Directlink-Admin-Key "";
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 195s;
    proxy_send_timeout 195s;
    proxy_buffering off;
    access_log off;
}
